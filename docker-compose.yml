services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://rightllm:rightllm@postgres:5432/rightllm
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rightllm
      POSTGRES_USER: rightllm
      POSTGRES_PASSWORD: rightllm
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
